name: Release Development

on:
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * *'

env:
  REGISTRY: docker.lechner-systems.at
  IMAGE_NAME: lechnersystems/portfolio

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      code: read
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changes since previous development release
        id: changes
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          API_URL: ${{ gitea.server_url }}/api/v1/repos/${{ gitea.repository }}/actions/workflows/BuildDev.yml/runs
        run: |
          runs="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: token ${GITEA_TOKEN}" \
            "${API_URL}?branch=main&limit=50")"
          previous_sha="$(printf '%s' "$runs" | jq -r \
            --argjson current_run "$GITEA_RUN_ID" \
            '[.workflow_runs[] | select(.id != $current_run and .status == "success" and (.event == "schedule" or .event == "workflow_dispatch"))][0].head_sha // empty')"
          if [ -z "$previous_sha" ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            git cat-file -e "${previous_sha}^{commit}"
            if git diff --quiet "$previous_sha" "$GITEA_SHA"; then
              echo 'changed=false' >> "$GITHUB_OUTPUT"
              echo 'No changes since the previous successful development release.'
            else
              echo 'changed=true' >> "$GITHUB_OUTPUT"
            fi
          fi

  docker:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      code: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js v24.15.0
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'

      - name: Set build version
        run: npm run version:set

      - name: Read version from package.json
        id: version
        run: |
          version=$(node -p 'require("./package.json").version')
          docker_tag=$version
          revision=${GITEA_RUN_ATTEMPT}
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "docker_tag=$docker_tag" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Build and push dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
            VCS_REF=${{ steps.version.outputs.revision }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev
