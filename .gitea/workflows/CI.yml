name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      code: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
      - run: npm ci
      - run: npm run lint

  formatting:
    runs-on: ubuntu-latest
    permissions:
      code: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
      - run: npm ci
      - run: npm run format:check

  metadata:
    runs-on: ubuntu-latest
    permissions:
      code: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
      - run: npm ci
      - run: npm run version:check
      - run: npm run text:check

  tests:
    runs-on: ubuntu-latest
    permissions:
      code: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
      - run: npm ci
      - name: Run tests
        run: npm run test
        env:
          CHROME_BIN: google-chrome
