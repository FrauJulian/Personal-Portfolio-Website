services:
  portfolio:
    image: docker.lechner-systems.at/lechnersystems/portfolio:${IMAGE_TAG}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    dns:
      - 192.168.100.2
      - 192.168.100.6
    ports:
      - ${MAIN_PORT}:3000
